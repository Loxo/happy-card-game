<button
  type="button"
  class="seat"
  [class.pos-top]="position() === 'top'"
  [class.pos-left]="position() === 'left'"
  [class.pos-right]="position() === 'right'"
  [class.is-turn]="isTurn()"
  [class.disconnected]="!connected()"
  [class.selectable]="selectable()"
  [disabled]="!selectable()"
  (click)="onClick()"
>
  <div class="avatar">
    <span>{{ avatarLetter() }}</span>
  </div>

  <div class="info">
    <div class="seat-head">
      <span class="seat-label">{{ seatLabel() }}</span>
      @if (isTurn()) {
        <span class="turn-dot" aria-label="current turn"></span>
      }
    </div>

    @if (!connected()) {
      <span class="badge badge-disconnected">{{ 'game.disconnected' | transloco }}</span>
    }

    @if (tableauSummary().length > 0) {
      <div class="chips">
        @for (entry of tableauSummary(); track entry.category) {
          <div class="chip">
            <span class="chip-icon" [style.background]="categoryVisual(entry.category).color">
              <app-icon [name]="categoryVisual(entry.category).icon" [size]="14" />
            </span>
            @if (entry.count > 1) {
              <span class="chip-count">×{{ entry.count }}</span>
            }
          </div>
        }
      </div>
    }
  </div>

  <div class="hand">
    <div class="hand-glyph" aria-hidden="true">
      @for (card of handGlyphs(); track $index) {
        <span class="glyph-card"></span>
      }
    </div>
    <span class="hand-count">{{ handCountLabel() }}</span>
  </div>
</button>
