<div class="tableau">
  @if (groups().length === 0) {
    <p class="empty">Your table is empty.</p>
  }
  @for (group of groups(); track group.category) {
    <div class="group">
      <div class="group-head">
        <span class="group-label">{{ group.category }}</span>
        @if (group.atCap) {
          <span class="badge badge-cap">at cap</span>
        }
      </div>
      <div class="group-cards">
        @for (card of group.cards; track card.instanceId) {
          <button type="button" class="card" [disabled]="disabled()" (click)="onCardClick(card)">
            {{ definitionOf(card).name }}
          </button>
        }
      </div>
    </div>
  }
</div>
