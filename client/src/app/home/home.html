<main class="home">
  <h1>{{ 'app.title' | transloco }}</h1>
  <p class="tagline">{{ 'home.tagline' | transloco }}</p>

  <section class="card">
    <h2>{{ 'home.startRoomTitle' | transloco }}</h2>
    <button type="button" class="btn btn-primary" (click)="createRoom()" [disabled]="status() === 'connecting'">
      {{ 'home.createRoom' | transloco }}
    </button>
  </section>

  <section class="card">
    <h2>{{ 'home.joinRoomTitle' | transloco }}</h2>
    <form (ngSubmit)="joinRoom()">
      <label for="join-code" class="visually-hidden">{{ 'home.roomCodeLabel' | transloco }}</label>
      <input
        id="join-code"
        type="text"
        [placeholder]="'home.roomCodePlaceholder' | transloco"
        maxlength="5"
        [ngModel]="joinCode()"
        (ngModelChange)="joinCode.set($event)"
        name="joinCode"
        autocomplete="off"
        autocapitalize="characters"
      />
      <button type="submit" class="btn btn-outline" [disabled]="status() === 'connecting' || !joinCode().trim()">
        {{ 'home.join' | transloco }}
      </button>
    </form>
  </section>

  <section class="card">
    <h2>{{ 'home.soloTitle' | transloco }}</h2>
    <div class="segmented" role="radiogroup" [attr.aria-label]="'home.botCountLabel' | transloco">
      @for (count of botCountOptions; track count) {
        <button
          type="button"
          role="radio"
          class="segment"
          [class.selected]="botCount() === count"
          [attr.aria-checked]="botCount() === count"
          (click)="botCount.set(count)"
        >
          {{ count }}
        </button>
      }
    </div>
    <button type="button" class="btn btn-primary btn-solo" (click)="startSolo()" [disabled]="status() === 'connecting'">
      {{ 'home.playSolo' | transloco }}
    </button>
  </section>

  @if (rejectedReason()) {
    <p class="error" role="alert">{{ rejectedReason() }}</p>
  }
</main>
