<div class="lang-switch" role="group" aria-label="Language">
  <button
    type="button"
    class="lang-btn"
    [class.active]="activeLang() === 'en'"
    (click)="setLang('en')"
  >
    EN
  </button>
  <button
    type="button"
    class="lang-btn"
    [class.active]="activeLang() === 'fr'"
    (click)="setLang('fr')"
  >
    FR
  </button>
</div>

<router-outlet />
